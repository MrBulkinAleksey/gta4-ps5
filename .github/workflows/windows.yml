# Builds the Windows app (windows/CMakeLists.txt) and uploads it as an
# artifact. Build steps by hand: windows/BUILD.md.
name: Windows

on:
  push:
    branches: [main, windows-port]
    # (the live MCP tool and docs are not part of the app: a change to them
    # alone would only cancel a build in progress)
    paths-ignore:
      - "tools/gta4-live-mcp/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "tools/gta4-live-mcp/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.3.296.0
  DXC_RELEASE: v1.8.2505.1
  DXC_ASSET: dxc_2025_07_14.zip
  ZSTD_VERSION: 1.5.6
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The submodules the glue build uses (as setup.sh), and the libmspack
      # fix; FFmpeg's PS5 patch only adds the PS5's config.
      - name: Submodules
        shell: bash
        run: |
          git -c submodule.recurse=false submodule update --init --depth 1 --jobs 8 \
            $(grep "path = glue/rexglue-sdk-main/thirdparty" .gitmodules | awk '{print $3}') tools/XenosRecomp
          git -C tools/XenosRecomp submodule update --init --depth 1 thirdparty/smol-v thirdparty/zstd thirdparty/xxHash
          git -C glue/rexglue-sdk-main/thirdparty/libmspack apply --ignore-space-change \
            "$PWD/cmake/dependency-patches/libmspack-xmem-block-padding.patch"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # glslangValidator and spirv-val for the renderer's shader overrides.
      - name: Vulkan SDK (cache)
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}
      - name: Vulkan SDK (install)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe" -OutFile $installer
          & $installer --root "C:\VulkanSDK\$env:VULKAN_SDK_VERSION" --accept-licenses --default-answer --confirm-command install | Out-Host
      - name: Vulkan SDK (environment)
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" >> $env:GITHUB_PATH

      # DXC 1.9: the 1.8 in XenosRecomp crashes on the Bink video shaders.
      - name: DXC
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$env:DXC_RELEASE/$env:DXC_ASSET" -OutFile "$env:RUNNER_TEMP\dxc.zip"
          Expand-Archive "$env:RUNNER_TEMP\dxc.zip" -DestinationPath "$env:RUNNER_TEMP\dxc"
          "DXC_BIN=$("$env:RUNNER_TEMP\dxc\bin\x64".Replace('\', '/'))" >> $env:GITHUB_ENV

      # A shared zstd for the FSR 3 shader archive builder (Python loads it).
      - name: zstd
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/facebook/zstd/releases/download/v$env:ZSTD_VERSION/zstd-v$env:ZSTD_VERSION-win64.zip" -OutFile "$env:RUNNER_TEMP\zstd.zip"
          Expand-Archive "$env:RUNNER_TEMP\zstd.zip" -DestinationPath "$env:RUNNER_TEMP\zstd"
          "ZSTD_DLL=$("$env:RUNNER_TEMP\zstd\zstd-v$env:ZSTD_VERSION-win64\dll\libzstd.dll".Replace('\', '/'))" >> $env:GITHUB_ENV

      # The FSR 3 motion-vector shader variants (about 2,700) are compiled into
      # a content-addressed work folder: kept between runs, only changed
      # shaders compile again.
      - name: Temporal shader cache
        uses: actions/cache@v4
        with:
          path: out/windows/glue/rexglue-sdk/src/graphics/generated/gta4_native/temporal/work
          key: temporal-${{ hashFiles('LibertyRecompLib/shader_overrides/**', 'LibertyRecompLib/shader/shader_cache.cpp', 'tools/vulkan/**') }}
          restore-keys: temporal-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Tools
        shell: pwsh
        run: |
          clang++ --version
          cmake --version
          ninja --version

      # (pwsh, not bash: Git's /usr/bin/link.exe must not stand in for the
      # MSVC tools; the link itself is LLD's)
      - name: Configure
        shell: pwsh
        run: |
          # (every -D quoted: pwsh splits an unquoted "-DX=3.5" at the dot)
          cmake -S windows -B out/windows -G Ninja "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_C_COMPILER=clang" "-DCMAKE_CXX_COMPILER=clang++" "-DCMAKE_LINKER_TYPE=LLD" `
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3" `
            "-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DREXGLUE_ENABLE_TRACY=OFF" `
            "-DGTA4_NATIVE_DXC_LIBRARY_PATH=$env:DXC_BIN" `
            "-DREXGLUE_ENABLE_FIDELITYFX=ON" `
            "-DGTA4_TEMPORAL_ZSTD_LIBRARY=$env:ZSTD_DLL"

      # -k 0: every failing file in one run.
      - name: Build
        shell: pwsh
        run: cmake --build out/windows --target LibertyRecomp -- -k 0

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: LibertyRecomp-windows-x64
          path: out/windows/LibertyRecomp
          if-no-files-found: error
